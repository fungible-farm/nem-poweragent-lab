[package]
name = "poweragent-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Gate 0 of issue #54: report available MXC backends and whether a task's requirements are supported. Read-only; executes nothing."

[dependencies]
mxc-sdk = "=1.0.1"
poweragent-policy = { path = "../poweragent-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
