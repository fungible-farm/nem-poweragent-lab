[package]
name = "poweragent-fallback"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Gate 3 of issue #54 (rules + native adapter): closed, typed JEA and native operations, authorised against an ADR-002 decision. No arbitrary PowerShell, no caller-supplied executable. The windows-rs adapter is in `native` (Windows only); JEA lives on branch feat/54-jea-endpoint-deferred."

[dependencies]
poweragent-policy = { path = "../poweragent-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
