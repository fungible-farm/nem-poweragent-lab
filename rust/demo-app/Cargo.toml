[package]
name = "demo-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Dioxus (Vue/React-in-Rust) power-simulation app: loads the phase-model WASM and replays the real Lab 5 fault transient client-side."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
phase-model = { path = "../phase-model" }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
] }
