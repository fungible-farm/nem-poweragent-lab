[package]
name = "poweragent-audit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Gate 4 of issue #54 (Linux-provable part): UI-independent structured events and a tamper-evident audit log. Audit is written before any subscriber (dashboard) is told, so a dead or absent dashboard changes nothing."

[dependencies]
poweragent-policy = { path = "../poweragent-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
