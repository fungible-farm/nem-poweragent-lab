[package]
name = "phase-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Oxidized phase_model.py -- one waveform state machine generates raw/phasor/SCADA/anomaly views (PSCADOSSE). Compiles to WASM for in-browser simulation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
