[package]
name = "systhread-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 0 of the systhread MBSE capability (docs/superpowers/specs/2026-08-25-systhread-design.md): parse/validate/render for SysML v2 Part/containment models, ported from labs/06-sysml-digital-thread's Python pipeline."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sysml-v2-parser = "0.54"
kasuari = "0.4"
# Generic Node/Edge graph vocabulary, promoted from this crate's own iso_ir.rs
# into ufo-types (b00t SysML v2 spine consolidation, elasticdotventures/_b00t_#1177,
# PromptExecution/ufo-types#4). Pinned by rev, not a tag: no release covers iso_ir yet.
ufo-types = { git = "https://github.com/PromptExecution/ufo-types.git", rev = "19422ac1988f916c83e15260b1f1a8969ef8d65a" }

# wasm-only dev-dependency: the native test build is completely unaffected by it.
# 0.3.77 pins wasm-bindgen =0.2.127, so the installed wasm-bindgen-cli must be 0.2.127 too --
# `just systhread-wasm-setup` installs the matching pair.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"
