[package]
name = "poweragent-podman"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Issue #54 sidecar runtime: start and stop administrator-registered, digest-pinned sidecar containers with Podman. Typed argv only (no shell, no caller command), network off, read-only root, all capabilities dropped."

[dependencies]
poweragent-sidecar = { path = "../poweragent-sidecar" }

[dev-dependencies]
serde_json = "1"
