[project]
name = "nem-poweragent-lab"
version = "0.1.0"
description = "PowerAgent Tutorial -- AEMO Labs (Labs 1-3 reference implementation)"
requires-python = ">=3.11"
dependencies = [
    "pandapower>=3.5.4",
    "powerio>=0.7.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.60",
    "nemosis>=3.8.1",
    "dpsim>=1.2.1",
    "simbench>=1.6.2",
    "networkx>=3.6.1",
    "pyyaml>=6.0.3",
    "matplotlib>=3.11.1",
    "mcp==1.12.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbconvert>=7.17.1",
    "pytest>=8.0",
]

[tool.uv]
package = false
