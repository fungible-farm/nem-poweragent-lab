[project]
name = "nem-poweragent-lab"
version = "0.1.0"
description = "PowerAgent Tutorial -- AEMO Labs (Labs 1-3 reference implementation)"
requires-python = ">=3.11"
dependencies = [
    "pandapower>=3.5.4",
    "powerio>=0.7.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
