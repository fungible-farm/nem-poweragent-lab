name: check

# Runs the same gate a contributor runs locally -- AGENTS.md "the proof
# scripts are the proof, not a transcript". No separate CI-only script: this
# workflow is a thin wrapper around `just fetch` / `just check` / `just
# rust-test`, so a green run here means a clean checkout reproduces it too.

on:
  push:
    branches: [main]
  # No `branches:` filter here (deliberately, not an oversight): a PR whose
  # base isn't `main` -- e.g. a stacked-PR-per-milestone workflow where each
  # PR targets the previous milestone's branch -- got zero real CI under the
  # old `branches: [main]` filter, since `pull_request`'s `branches` matches
  # the PR's *base*, not `main` itself. Discovered when systhread Phase 0's
  # stacked PRs (#32-#35) all ran real checks only via local `cargo test`
  # inside subagents, not GitHub Actions, until the stack collapsed onto
  # `main` directly. See docs/superpowers/specs/2026-08-25-systhread-design.md
  # §8.
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            labs/08-cim-gridy-phase0-spikes/0b-sysml-v2-parser
            labs/08-cim-gridy-phase0-spikes/0d-ufo-types-scryer-prolog

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync Python deps
        run: just sync

      - name: Fetch CSIRO case data
        run: just fetch

      # systhread-core's ouroboros gate (check-systhread-wasm, part of `just check`) needs a
      # wasm-bindgen-cli whose version matches wasm-bindgen-test's pin exactly, or the test
      # runner rejects the module with a schema-version error -- see
      # docs/superpowers/plans/2026-08-26-systhread-3d-explorer-v1.md Task 6. The
      # `wasm32-unknown-unknown` target itself comes from the toolchain step above; this only
      # installs the CLI.
      - name: Install matching wasm-bindgen-cli
        run: just systhread-wasm-setup

      - name: Per-lab check gates (labs 1-9)
        run: just check

      - name: Rust workspace tests (phase-model, demo-app, fft-detector)
        run: just rust-test

  # PowerAgent (issue #54) on Windows. The Linux job above compiles the cross-platform crates but skips every
  # `cfg(windows)` test. This job compiles ALL PowerAgent crates and tests for Windows and runs the Windows-only tests
  # that need no sandbox backend (the native adapter, including its junction / reparse-point escape tests).
  #
  # What it deliberately does NOT run: the MXC processcontainer adversarial tests, the end-to-end tests and the
  # Podman tests. They need a Windows 11 build at or above the MXC floor (docs/poweragent/mxc-os-floor.txt) and Podman,
  # which hosted runners do not guarantee. Those run via `just poweragent::chain` on a prepared machine; see
  # docs/poweragent/gate0-status.md. Do not read a green result here as proof of Windows sandbox enforcement.
  poweragent-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compile every PowerAgent crate and test for Windows
        run: cargo check --locked --tests -p poweragent -p poweragent-exec -p poweragent-probe -p poweragent-fallback -p poweragent-podman -p poweragent-sidecar -p poweragent-audit -p poweragent-policy

      - name: Windows-only tests that need no sandbox backend (native adapter, reparse-point escapes)
        run: cargo test --locked -p poweragent-fallback --test native_windows

      - name: Logic suites on Windows
        run: cargo test --locked -p poweragent-policy -p poweragent-sidecar -p poweragent-audit -p poweragent-fallback --test fail_closed --test gate2 --test gate4 --test gate3_rules

      - name: Podman argument tests (no container runtime needed)
        run: cargo test --locked -p poweragent-podman --test args
