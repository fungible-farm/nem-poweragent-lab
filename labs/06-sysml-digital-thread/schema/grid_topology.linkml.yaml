id: https://github.com/fungible-farm/nem-poweragent-lab/labs/06-sysml-digital-thread/grid-topology
name: digital-thread-track-b
description: >-
  Track B of Lab 6's SysML v2 digital-thread evaluation: business case 2, grid network system
  design/simulation. Three classes -- Bus, Generator, Line -- seeded from a real, small, connected
  cluster of CSIRO's Synthetic-NEM-2000-Bus `snemSA.m` (the same case Lab 1 loads), not invented.
  See grid_instances.yaml's header for exactly how that cluster was selected.

  CIM class-URI traceability (PRD-0007): every Bus/Generator/Line instance also carries a
  `cim_class_uri` pointing at the real IEC CIM/CGMES class it corresponds to, computed by
  `build_grid_instances.py` from the fixed mapping table below -- never hand-entered per instance.
  LinkML remains this track's schema authority; CIM is referenced metadata, not a dependency swap
  (CGMES RDF-XML import/export and CIM-as-schema-of-record are explicitly out of scope here).

  Mapping table (pinned to CIM16 / CGMES 2.4, namespace `http://iec.ch/TC57/2013/CIM-schema-cim16#`
  -- confirmed against ENTSO-E's own published CGMES v2.4 conformity test data, which declares this
  exact namespace and uses `cim:SynchronousMachine`/`cim:PowerTransformer`/`cim:ACLineSegment` as
  real element names in it; a newer CIM100/CGMES 3.0 namespace also exists but CIM16 remains the
  safer default citation given how much current tooling and test data still targets it):
    - `Bus -> cim:TopologicalNode` (not `cim:ConnectivityNode`): IEC 61970's own node-breaker vs.
      bus-branch split makes `ConnectivityNode` a physical terminal-level connection point (one per
      switch position) and `TopologicalNode` the logical bus a topology processor derives after
      collapsing connectivity nodes on closed switches -- confirmed via IEC61970::Base::Topology
      docs and ENTSO-E's CGM Building Process guide. `snemSA.m` is a MATPOWER case with no
      switch/breaker model at all, i.e. already a bus-branch abstraction, which structurally
      matches `TopologicalNode`, not `ConnectivityNode`.
    - `Generator -> cim:SynchronousMachine`
    - `Line(kind="transmission") -> cim:ACLineSegment`
    - `Line(kind="transformer") -> cim:PowerTransformer`

prefixes:
  linkml: https://w3id.org/linkml/
  grid_topology: https://github.com/fungible-farm/nem-poweragent-lab/labs/06-sysml-digital-thread/grid-topology/

default_prefix: grid_topology
default_range: string

imports:
  - linkml:types

slots:
  name:
    identifier: true
    description: Short, unique, SysML-part-def-safe identifier (no spaces).
    required: true
  source:
    description: >-
      Where this instance's real value comes from -- always "data/snemSA.m" for this track, plus
      the bus/branch index within it, so the number is auditable back to the case file.
    required: true
  voltage_kv:
    description: Nominal voltage at this bus, kV -- Bus only. From snemSA.m's own vn_kv column.
    range: float
  bus:
    description: The Bus this Generator is connected to -- Generator only, a reference to Bus.name.
    range: Bus
  rated_mw:
    description: >-
      Real modelled active-power output for this unit at the case's base operating point, MW --
      Generator only. From snemSA.m's own gen table p_mw column, not a nameplate rating (this
      synthetic case does not carry one separately).
    range: float
  from_bus:
    description: Line only -- one end of the connection, a reference to Bus.name.
    range: Bus
  to_bus:
    description: Line only -- the other end, a reference to Bus.name.
    range: Bus
  kind:
    description: >-
      Line only -- "transmission" for a real modelled line, "transformer" for a real modelled
      step-up/step-down transformer. Both are real branches in snemSA.m; kept as one class with a
      kind slot rather than a fourth class, matching this MVP's "3 classes" scope -- see
      grid_instances.yaml's header for why the transformer sn_mva values look implausibly large.
    range: string
  length_km:
    description: Line only, transmission kind -- real per-branch length from snemSA.m. Not set for transformers.
    range: float
  cim_class_uri:
    description: >-
      The real IEC CIM/CGMES class URI this instance corresponds to (CIM16 namespace, see this
      file's header for the full mapping table and sourcing). Computed by build_grid_instances.py
      from the fixed mapping table, never hand-entered per instance.
    required: true
  buses:
    description: Every Bus instance in this grid topology.
    range: Bus
    multivalued: true
    inlined: true
    inlined_as_list: true
  generators:
    description: Every Generator instance in this grid topology.
    range: Generator
    multivalued: true
    inlined: true
    inlined_as_list: true
  lines:
    description: Every Line instance in this grid topology.
    range: Line
    multivalued: true
    inlined: true
    inlined_as_list: true

classes:
  Bus:
    description: A real connection point in snemSA.m -- generators, loads, and lines attach here.
    slots: [name, source, voltage_kv, cim_class_uri]
  Generator:
    description: A real generating unit modelled in snemSA.m, attached at one Bus.
    slots: [name, source, bus, rated_mw, cim_class_uri]
  Line:
    description: A real branch (transmission line or transformer) connecting two buses in snemSA.m.
    slots: [name, source, from_bus, to_bus, kind, length_km, cim_class_uri]
  GridTopology:
    description: >-
      The root container this lab's generator reads: every Bus/Generator/Line instance in Track
      B's model. Adding one entry here and re-running the generator is Track B's version of the
      same demo Track A shows for the AI-workflow schema.
    tree_root: true
    slots: [buses, generators, lines]
