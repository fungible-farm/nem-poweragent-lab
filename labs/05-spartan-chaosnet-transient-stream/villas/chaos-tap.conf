// VILLASnode config for Lab 5's "sub-3-tap" pod.
//
// Format and every node-type/field below is real, confirmed against
// registry.git.rwth-aachen.de/acs/public/villas/node:latest (VILLASnode
// 1.1.0) by direct experiment in this sandbox (`podman run` + `villas-node
// <this-shaped-config>`, not guessed from documentation) -- see
// kube/villasnode-tap-pod.yaml's header and this lab's README "Sandbox
// notes" section for the full story, including the one node-type that is
// compiled into this image but does NOT actually start here.
//
// http.port: the image's embedded web/API subsystem defaults to port 80,
// which this container cannot bind (confirmed: EACCES, "Failed to
// initialize virtual host") when run with hostNetwork -- moved to an
// unprivileged port instead of disabling the subsystem.
http = { port = 8761 }

nodes = {
    // Real input: DPsim's own per-timestep fault-substation voltage
    // waveform (run_dpsim.py's _write_villas_csv output), in VILLASnode's
    // own native `file`/`csv` format. `in.rate = 5000.0` replays at
    // DPsim's real solve rate (1 / TIME_STEP_S = 1 / 200us = 5000 Hz),
    // so a receiver's *achieved* sample rate is a real end-to-end
    // measurement of the 4kHz-class claim, not just DPsim's own internal
    // timestep.
    // eof = "rewind": loops the captured transient continuously so the
    // stream has live, ongoing traffic no matter when a receiver connects
    // -- verified real captured DPsim data replayed on a loop (the same
    // 2750 real samples from one real solve, repeating), not fabricated
    // data. A production tap would instead stay attached to a live DPsim
    // process (see this lab's README "Sandbox notes" for why this run
    // writes to a file rather than streaming DPsim's own
    // dpsimpyvillas.InterfaceVillas directly).
    chaos_stream_in = {
        type = "file"
        uri = "/data/chaos_stream.csv"
        format = "csv"
        in = { rate = 5000.0, epoch_mode = "direct", eof = "rewind" }
    }

    // Real, running, verified output: UDP socket, JSON-framed samples.
    // This is the node verify_stream.py --node sub-3-tap actually connects
    // to. Named "sub-3-tap" to match docs/LAB5_SPARTAN_CHAOSNET.md step
    // 3/4's literal node name.
    sub-3-tap = {
        type = "socket"
        layer = "udp"
        format = "json"
        in = { address = "*:12001" }
        out = { address = "127.0.0.1:12000" }
    }

    // -----------------------------------------------------------------
    // NOT started in this sandbox -- documented substitution, not a
    // silent omission (see AGENTS.md "sandbox stand-ins must be named").
    //
    // iec61850-9-2 (IEC 61850-9-2 Sampled Values) IS compiled into this
    // exact image build: `villas-node` accepts this node-type in a config
    // and logs "Initialized node type which is used by 1 nodes" for it.
    // But actually *starting* it (wiring it into an active `paths` entry)
    // fails every time in this sandbox:
    //
    //   err node   Failed to create SV publisher
    //
    // ...and that failure brings the whole villas-node process down (exit
    // 255) -- including the sub-3-tap socket path above, which otherwise
    // works.
    //
    // ROOT-CAUSED, not just "confirmed unfixable by flags". Pulled the
    // real image source (it ships its own build tree under /villas) and
    // read lib/nodes/iec61850_sv.cpp: iec61850_sv_start() does exactly one
    // privileged thing --
    //
    //   i->out.publisher = SVPublisher_createEx(&comm_params, i->interface,
    //                                            i->out.vlan.enabled);
    //   if (i->out.publisher == nullptr)
    //     throw RuntimeError("Failed to create SV publisher");   // <- this
    //
    // ...which bottoms out in libiec61850 v1.6.1's
    // hal/ethernet/linux/ethernet_linux.c, Ethernet_createSocket():
    //
    //   self->rawSocket = socket(AF_PACKET, SOCK_RAW, htons(ETH_P_ALL));
    //
    // Reproduced directly (Python, same image, same syscall) with
    // `podman run --network host --privileged`:  PermissionError(1,
    // 'Operation not permitted') -- EPERM, every time, privileged or not.
    //
    // WHY --privileged doesn't help: this sandbox's podman is rootless
    // (`podman info` -> rootless: true, rootlessNetworkCmd: pasta). The
    // kernel checks CAP_NET_RAW for AF_PACKET raw sockets against the
    // *user namespace that owns the network namespace* the socket is
    // opened in, not just the calling process's own capability set. With
    // `hostNetwork: true` (`--network host`), the container's socket call
    // executes in the *host's real* network namespace, which is owned by
    // the host's initial (root) user namespace -- not this container's
    // private, subuid-mapped rootless user namespace. Rootless podman's
    // `--privileged` can only grant capabilities that are effective inside
    // the container's own private user namespace; it structurally cannot
    // grant CAP_NET_RAW against the host's initial user namespace, because
    // the real underlying host user (uid 1000, genuinely unprivileged)
    // never had that capability to delegate. This is a deliberate kernel
    // security boundary, not a missing flag -- see
    // https://github.com/containers/podman/discussions/19009 and
    // https://github.com/containers/podman/discussions/21079 ("CAP_NET_RAW
    // is network namespace aware... this can never be done on the host
    // network namespace... rootless podman cannot gain more privileges
    // than your user already has").
    //
    // ISOLATED THE VARIABLE for real, not just asserted it: re-ran the
    // exact same `--privileged` image *without* hostNetwork (a private
    // netns owned by this container's own rootless user namespace) with
    // this same SV config (interface = "lo") -- the raw socket succeeds,
    // `villas-node` logs "Starting node sv_out(iec61850-9-2): ..." and
    // runs cleanly with no "Failed to create SV publisher" error at all.
    // This confirms the failure is specifically about *host netns
    // ownership*, not "rootless can never do raw sockets" and not a
    // VILLASnode/libiec61850 bug or a config mistake in this file.
    //
    // BUT a private netns doesn't get you a working SV stream either, for
    // a second, independent reason: this sandbox's rootless network
    // backend is `pasta` (confirmed via `podman info`), which is
    // documented (https://passt.top/passt/about/) as "a translation layer
    // between a Layer-2 network interface and native Layer-4 sockets (TCP,
    // UDP, ICMP/ICMPv6 echo)" -- it does not forward arbitrary/non-IP
    // EtherTypes. IEC 61850-9-2 SV frames use EtherType 0x88BA (raw L2
    // multicast, not IP). So a private-netns SV publisher would start
    // without error but silently black-hole every frame -- a worse, silent
    // failure mode than the current crash-on-start.
    //
    // Also tried macvlan (a genuinely L2-native podman network driver, in
    // case it routes around pasta): `podman network create -d macvlan -o
    // parent=enp3s0 ...` succeeds at the podman/netavark config level even
    // rootless, and a container attached to it gets a raw-socket-capable
    // "eth0". But watching the *host's* `ip -d link show` while that
    // container runs shows no macvlan slave device ever attached to the
    // real parent NIC -- rootless podman cannot create a genuine macvlan
    // slave of a physical interface (that also needs CAP_NET_ADMIN against
    // the host's real netns), so it is silently backed by the same
    // rootless-netns/pasta plumbing. Same root cause, same dead end.
    //
    // One more real finding worth naming for whoever picks this up:
    // libiec61850 in this exact image *is* built with Routable SV/GOOSE
    // support (IEC 61850-90-5) -- `nm -D libiec61850.so.1.6.1` shows
    // `SVPublisher_createRemote` and the `RSession_*` family (ordinary
    // UDP/IP sockets, no raw AF_PACKET, would work fine under this
    // sandbox's rootless networking). But VILLASnode's own
    // lib/nodes/iec61850_sv.cpp (the file implementing *this* node-type)
    // never calls any of them -- only the raw/local SVPublisher_createEx
    // path above is wired up, so Routable SV is unreachable from config
    // alone here; it would need a VILLASnode source patch and rebuild.
    // VILLASnode's iec61850-8-1 (GOOSE) node-type, by contrast, *does*
    // wire up the routable path (lib/nodes/iec61850_goose.cpp, `routed =
    // true` with `local_address`/`remote_address`/`multicast_groups` +
    // mandatory session `keys` -- ordinary UDP, no raw socket needed) --
    // real, working, IEC-61850-lineage, and IP-routable in this sandbox,
    // but it is GOOSE (event/status), not Sampled Values (continuous
    // waveform), so swapping to it would not honestly satisfy this DoD
    // line's literal "Sampled Values" wording and was deliberately not
    // done here -- named as an option, not silently substituted.
    //
    // Net conclusion: this is a genuine, three-way-confirmed rootless-
    // Podman infrastructure limitation (host netns raw socket: denied by
    // the kernel's namespace-capability model; private/pasta netns: raw
    // socket allowed but L2 frames never forwarded; macvlan: not really
    // attached to the physical NIC under rootless), not a config mistake
    // and not fixable by any flag or node-type substitution available
    // here. Closing it for real needs either genuine root (rootful podman
    // / `sudo podman`, not just `--privileged` rootless) with `--network
    // host` and a real dedicated NIC -- which is what IEC 61850-9-2 SV
    // assumes in production anyway -- or running villas-node directly on
    // bare metal outside any container.
    //
    // Uncomment this block (and add it to `paths` as its own destination,
    // NOT fanned out from the same path as sub-3-tap, so a future SV
    // failure can't take the verified socket path down with it) on a host
    // with a real interface, genuine root, and the necessary privileges:
    //
    // sv_out = {
    //     type = "iec61850-9-2"
    //     interface = "lo"
    //     dst_address = "01:0c:cd:01:00:01"
    //     out = {
    //         signals = ({ iec_type = "float32" }, { iec_type = "float32" }, { iec_type = "float32" })
    //         sv_id = "chaosnet-sub3"
    //         smp_mod = "samples_per_second"
    //         smp_synch = "local_clock"
    //         conf_rev = 1
    //     }
    // }
}

paths = (
    { in = "chaos_stream_in", out = "sub-3-tap" }

    // Add once sv_out (above) is uncommented on real hardware:
    // { in = "chaos_stream_in", out = "sv_out" }
)
